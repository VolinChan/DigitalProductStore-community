<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>密码重置 - {{.BrandName}}</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; color: #333;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden;">
        <tr>
            <td style="background: #1890ff; color: #ffffff; padding: 24px; text-align: center;">
                <h1 style="margin: 0; font-size: 22px;">{{.BrandName}}</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 24px;">
                <h2 style="margin-top: 0; color: #1890ff;">密码重置请求</h2>
                <p>您好，</p>
                <p>我们收到了您账户的密码重置请求。请在 1 小时内使用下方链接完成密码重置，超时后链接将失效。</p>
                <p style="margin: 24px 0;">
                    <a href="{{.ResetURL}}" style="display: inline-block; padding: 10px 20px; background: #1890ff; color: #ffffff; text-decoration: none; border-radius: 4px;">重置密码</a>
                </p>
                <p style="word-break: break-all; font-size: 12px; color: #888;">如果按钮无法点击，请将以下链接复制到浏览器：<br>{{.ResetURL}}</p>
                <p>如果您没有发起该请求，请忽略此邮件，您的密码不会被修改。</p>
                <p style="color: #888; font-size: 12px; margin-top: 32px;">请勿将此邮件中的链接或令牌分享给他人。</p>
            </td>
        </tr>
        <tr>
            <td style="background: #fafafa; padding: 16px; text-align: center; font-size: 12px; color: #999;">
                © {{.BrandName}}
            </td>
        </tr>
    </table>
</body>
</html>
