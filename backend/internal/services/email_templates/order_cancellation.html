<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>订单已取消 - {{.BrandName}}</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; color: #333;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden;">
        <tr>
            <td style="background: #595959; color: #ffffff; padding: 24px; text-align: center;">
                <h1 style="margin: 0; font-size: 22px;">{{.BrandName}}</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 24px;">
                <h2 style="margin-top: 0; color: #595959;">订单已取消</h2>
                <p>您好{{if .CustomerName}} {{.CustomerName}}{{end}}，</p>
                <p>您的订单已取消。如果您在取消前已支付，请联系客服确认退款事宜。</p>
                <table width="100%" cellpadding="8" cellspacing="0" style="background: #fafafa; border: 1px solid #eee; border-radius: 4px; margin: 16px 0;">
                    <tr>
                        <td style="font-weight: bold; width: 140px;">订单号</td>
                        <td>{{.OrderNumber}}</td>
                    </tr>
                </table>
                <p>期待您下次光临。</p>
                <p style="color: #888; font-size: 12px; margin-top: 32px;">如有疑问，请联系我们的客户支持。</p>
            </td>
        </tr>
        <tr>
            <td style="background: #fafafa; padding: 16px; text-align: center; font-size: 12px; color: #999;">
                © {{.BrandName}}
            </td>
        </tr>
    </table>
</body>
</html>
